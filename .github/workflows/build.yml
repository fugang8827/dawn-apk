name: Build Dawn Debt Tracker APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.5'

      - name: Build Release APK
        run: gradle assembleRelease --no-daemon

      - name: Rename APK
        run: cp app/build/outputs/apk/release/app-release.apk ./破晓记账_v2.0_纯原生.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: 破晓记账-纯原生安卓版-APK
          path: ./破晓记账_v2.0_纯原生.apk
